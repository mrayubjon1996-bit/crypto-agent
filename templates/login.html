<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login - MEME QUANTUM</title>
    <style>
        body{background:#000;color:#00f2ff;font-family:monospace;display:flex;justify-content:center;align-items:center;height:100vh;margin:0}
        .login-box{background:#0a0a0a;padding:30px;border-radius:12px;border:2px solid #00f2ff;text-align:center;width:280px}
        input{background:#111;border:1px solid #00f2ff;color:#00f2ff;padding:10px;width:90%;margin:15px 0;border-radius:6px;font-size:16px}
        button{background:#00f2ff;color:#000;border:none;padding:10px 20px;border-radius:6px;cursor:pointer;font-weight:bold}
        .error{color:#ff3366;font-size:12px}
    </style>
</head>
<body>
    <div class="login-box">
        <h2>🔐 MEME QUANTUM</h2>
        <form method="POST">
            <input type="password" name="password" placeholder="Введите пароль" autofocus>
            <br>
            <button type="submit">ВОЙТИ</button>
        </form>
        {% if error %}<div class="error">{{ error }}</div>{% endif %}
    </div>
</body>
</html>
